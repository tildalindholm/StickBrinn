<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="TildasTest.css">
</head>
<body>
    <hgroup>
        <h1>Dagny Sweater</h1>
        <div class="projectInfo">
            <span class="info">Yarn: Rauma Fivel</span>
            <span class="info">Colorway: 300 Naturmelert</span>
            <span class="info">Needles: 5mm & 4mm</span>
            <span class="info">Gauge: 18sts x 26rows</span>
            <button>Show images</button>
        </div>
    </hgroup>
    <section class="fullPattern">
        <article class="writtenPattern">
            <h2>Written pattern</h2>
        </article>
        <article class="chart">
            <h2>Chart A</h2>
            <h3>Body</h3>
            <img src="images/riddarechart.png" alt="Chart med riddarmotiv">
            <nav class="row">
                <span>1</span>
                <button>Prev</button>
                <span>2</span>
                <button>Next</button>
                <span>3</span>
            </nav>
        </article>
    </section>
    <script src="TildasTest.js"></script>
</body>
</html>
